<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>原型发布 · Miyako-Leo</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e0e7ff 0%, transparent 50%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 20px 80px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 22px 18px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }
    .card p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    a.btn:hover { filter: brightness(1.05); }
    .meta {
      margin-top: 18px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main>
    <h1>原型发布</h1>
    <p class="sub">公开仓库 distribute · GitHub Pages</p>
    <section class="card">
      <h2>人工询价 · 10月原型文件</h2>
      <p>广材询价本轮迭代 Axure 原型（需求列表 + 各优先级页面），已整合在同一文件夹下。</p>
      <a class="btn" href="./%E4%BA%BA%E5%B7%A5%E8%AF%A2%E4%BB%B710%E6%9C%88%E5%8E%9F%E5%9E%8B%E6%96%87%E4%BB%B6/">打开原型预览 →</a>
      <p style="margin-top:14px;margin-bottom:8px;"><a href="./%E4%BA%BA%E5%B7%A5%E8%AF%A2%E4%BB%B710%E6%9C%88%E5%8E%9F%E5%9E%8B%E6%96%87%E4%BB%B6/%E8%AF%A2%E4%BB%B7%E8%BF%9B%E5%B1%95-%E5%90%8E%E5%8F%B0%E8%AE%BE%E8%AE%A1.html" style="color:#2563eb;text-decoration:none;font-size:14px;font-weight:600;">询价进展-后台设计.html →</a></p>
      <div class="meta">路径：/人工询价10月原型文件/</div>
    </section>
  </main>
</body>
</html>
